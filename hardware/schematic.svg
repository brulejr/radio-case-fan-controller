<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1240" width="1140" height="1240" font-family="Helvetica, Arial, sans-serif">
  <title>Radio Case Fan Controller - schematic / wiring diagram</title>

  <defs>
    <style>
      .wire   { fill:none; stroke:#334155; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
      .w12v   { fill:none; stroke:#7f1d1d; stroke-width:3;   stroke-linecap:round; stroke-linejoin:round; }
      .w5v    { fill:none; stroke:#dc2626; stroke-width:3;   stroke-linecap:round; stroke-linejoin:round; }
      .w33v   { fill:none; stroke:#ea580c; stroke-width:3;   stroke-linecap:round; stroke-linejoin:round; }
      .wgnd   { fill:none; stroke:#0f172a; stroke-width:3;   stroke-linecap:round; stroke-linejoin:round; }
      .wsig   { fill:none; stroke:#2563eb; stroke-width:3;   stroke-linecap:round; stroke-linejoin:round; }
      .rail5  { fill:none; stroke:#dc2626; stroke-width:4.5; stroke-linecap:round; }
      .railg  { fill:none; stroke:#0f172a; stroke-width:4.5; stroke-linecap:round; }
      .blk    { fill:#f8fafc; stroke:#0f172a; stroke-width:2.5; }
      .part   { fill:#ffffff; stroke:#0f172a; stroke-width:2.5; }
      .todo   { fill:none; stroke:#64748b; stroke-width:2; stroke-dasharray:8 6; }
      .tm     { font-size:14px; fill:#0f172a; font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace; }
      .ts     { font-size:13px; fill:#1e293b; }
      .tss    { font-size:12px; fill:#334155; }
      .tb     { font-size:16px; fill:#0f172a; font-weight:bold; }
      .ttl    { font-size:24px; fill:#0f172a; font-weight:bold; }
      .lbl5   { font-size:14px; fill:#b91c1c; font-weight:bold; }
      .lbl33  { font-size:14px; fill:#c2410c; font-weight:bold; }
      .lblg   { font-size:14px; fill:#0f172a; font-weight:bold; }
      .lblsig { font-size:13px; fill:#1d4ed8; font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1140" height="1240" fill="#ffffff"/>

  <!-- ================= TITLE ================= -->
  <text class="ttl" x="40" y="48" font-size="24px" fill="#0f172a" font-weight="bold">Radio Case Fan Controller &#8212; Schematic / Wiring Diagram</text>
  <text class="ts"  x="40" y="74" font-size="13px" fill="#1e293b">ESP32-C6 + DS18B20 + 1&#8211;2 &#215; Noctua NF-A4x20 5V PWM &#183; ICOM IC-2730A case &#183; rev E</text>
  <text class="ts"  x="40" y="96" font-size="13px" fill="#1e293b">Connection table, BOM, bring-up order and gotchas: docs/wiring.md</text>

  <!-- J1 input terminal -->
  <rect class="part" x="50" y="150" width="60" height="100" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <text class="tb"  x="80"  y="143" text-anchor="middle" font-size="16px" fill="#0f172a" font-weight="bold">J1</text>
  <text class="tm"  x="96"  y="187" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">+</text>
  <text class="tm"  x="96"  y="227" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">&#8722;</text>
  <text class="ts"  x="80"  y="274" text-anchor="middle" font-size="13px" fill="#1e293b">12 V in</text>
  <text class="tss" x="80"  y="291" text-anchor="middle" font-size="12px" fill="#334155">(radio supply)</text>

  <!-- J1 feeds U1 directly -->
  <path class="w12v" d="M110,180 L460,180" fill="none" stroke="#7f1d1d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="wgnd" d="M110,220 L400,220 L400,260 L460,260" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="tss" x="285" y="172" text-anchor="middle" font-size="12px" fill="#334155">+12 V</text>
  <text class="tss" x="250" y="212" text-anchor="middle" font-size="12px" fill="#334155">GND</text>
  <text class="tss" x="250" y="312" text-anchor="middle" font-size="12px" fill="#334155">No onboard protection by design &#8212; the battery / bench supply handles surge and polarity.</text>
  <text class="tss" x="250" y="328" text-anchor="middle" font-size="12px" fill="#334155">GND is one net throughout: J1, U1, the dev board, both fans and the probe.</text>

  <!-- ================= U1 BUCK CONVERTER ================= -->
  <rect class="blk" x="460" y="150" width="180" height="140" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text class="tb"  x="550" y="176" text-anchor="middle" font-size="16px" fill="#0f172a" font-weight="bold">U1 &#183; buck</text>
  <text class="ts"  x="550" y="196" text-anchor="middle" font-size="13px" fill="#1e293b">5.00 V, USB-C out</text>
  <text class="tss" x="468" y="185" font-size="12px" fill="#334155">IN+</text>
  <text class="tss" x="468" y="265" font-size="12px" fill="#334155">IN&#8722;</text>
    <text class="tss" x="632" y="229" text-anchor="end" font-size="12px" fill="#334155">USB-C</text>

  <path class="w5v"  d="M640,225 L700,225 L700,440 L130,440 L130,540 L150,540" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="tss" x="415" y="432" text-anchor="middle" font-size="12px" fill="#334155">USB-C cable (5 V + GND)</text>


  <!-- main GND trunk -->
  <path class="wgnd" d="M60,620 L60,1120" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= +5 V RAIL ================= -->


  <!-- ================= U2 ESP32 ================= -->
  <text class="tb" x="260" y="478" text-anchor="middle" font-size="16px" fill="#0f172a" font-weight="bold">U2 &#183; ESP32-C6-WROOM-1 board (2&#215;15)</text>
  <rect class="blk" x="150" y="490" width="220" height="520" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text class="tss" x="260" y="1046" text-anchor="middle" font-size="12px" fill="#334155">symbol pin order is logical,</text>
  <text class="tss" x="260" y="1062" text-anchor="middle" font-size="12px" fill="#334155">not the physical header order</text>

  <text class="tm" x="160" y="546" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">USB-C</text>
  <text class="tm" x="160" y="626" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">GND</text>
  <path class="wgnd" d="M150,620 L60,620" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="tm" x="360" y="536" text-anchor="end" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">3V3</text>
  <text class="tm" x="360" y="596" text-anchor="end" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">GPIO6</text>
  <text class="tm" x="360" y="736" text-anchor="end" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">GPIO19</text>
  <text class="tm" x="360" y="796" text-anchor="end" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">GPIO18</text>
  <text class="tm" x="360" y="896" text-anchor="end" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">GPIO21</text>
  <text class="tm" x="360" y="956" text-anchor="end" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">GPIO20</text>
  <text class="tm" x="360" y="1006" text-anchor="end" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">5V</text>

  <!-- ================= SIGNAL / 3V3 RUNS ================= -->
  <path class="w33v" d="M370,530 L720,530" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lbl33" x="398" y="520" font-size="14px" fill="#c2410c" font-weight="bold">+3.3 V</text>

  <path class="wsig" d="M370,590 L720,590" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lblsig" x="398" y="581" font-size="13px" fill="#1d4ed8" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">1-WIRE DATA</text>

  <path class="wsig" d="M370,730 L720,730" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lblsig" x="398" y="721" font-size="13px" fill="#1d4ed8" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">TACH1</text>

  <path class="wsig" d="M370,790 L720,790" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lblsig" x="398" y="781" font-size="13px" fill="#1d4ed8" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">PWM1 25 kHz</text>

  <path class="wsig" d="M370,890 L720,890" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lblsig" x="398" y="881" font-size="13px" fill="#1d4ed8" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">TACH2</text>

  <path class="wsig" d="M370,950 L720,950" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lblsig" x="398" y="941" font-size="13px" fill="#1d4ed8" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">PWM2 25 kHz</text>

  <!-- R1 4k7 DS18B20 pull-up, bridging the 3V3 and DATA runs -->
  <path class="w33v" d="M520,530 L520,546" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="part" x="509" y="546" width="22" height="28" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <path class="wsig" d="M520,574 L520,590" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="520" cy="530" r="5.5" fill="#ea580c"/>
  <circle cx="520" cy="590" r="5.5" fill="#2563eb"/>
  <text class="tss" x="539" y="557" font-size="12px" fill="#334155">R1</text>
  <text class="tss" x="539" y="572" font-size="12px" fill="#334155">4.7 k</text>

  <!-- 3V3 distribution down to the tach pull-ups (hops = no connection) -->
  <path class="w33v" d="M610,530
                        L610,581 A 9,9 0 0,0 610,599
                        L610,721 A 9,9 0 0,0 610,739
                        L610,781 A 9,9 0 0,0 610,799
                        L610,820" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="610" cy="530" r="5.5" fill="#ea580c"/>

  <!-- R2 10k tach 1 pull-up -->
  <circle cx="610" cy="670" r="5.5" fill="#ea580c"/>
  <path class="w33v" d="M610,670 L660,670 L660,682" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="part" x="649" y="682" width="22" height="28" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <path class="wsig" d="M660,710 L660,730" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="660" cy="730" r="5.5" fill="#2563eb"/>
  <text class="tss" x="680" y="693" font-size="12px" fill="#334155">R2</text>
  <text class="tss" x="680" y="708" font-size="12px" fill="#334155">10 k</text>

  <!-- R3 10k tach 2 pull-up -->
  <path class="w33v" d="M610,820 L660,820 L660,832" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="part" x="649" y="832" width="22" height="28" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <path class="wsig" d="M660,860 L660,890" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="660" cy="890" r="5.5" fill="#2563eb"/>
  <text class="tss" x="680" y="843" font-size="12px" fill="#334155">R3</text>
  <text class="tss" x="680" y="858" font-size="12px" fill="#334155">10 k</text>

  <!-- ================= DS18B20 ================= -->
  <rect class="blk" x="720" y="500" width="240" height="180" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text class="tm"  x="730" y="536" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">VDD</text>
  <text x="730" y="553" font-size="12px" fill="#b91c1c">red</text>
  <text class="tm"  x="730" y="596" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">DATA</text>
  <text x="730" y="613" font-size="12px" fill="#a16207">yellow</text>
  <text class="tb"  x="862" y="586" text-anchor="middle" font-size="16px" fill="#0f172a" font-weight="bold">DS18B20</text>
  <text class="ts"  x="862" y="607" text-anchor="middle" font-size="13px" fill="#1e293b">enclosure temp probe</text>
  <text class="tss" x="862" y="626" text-anchor="middle" font-size="12px" fill="#334155">waterproof, 1 m lead</text>
  <text class="tm"  x="950" y="646" text-anchor="end" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">GND</text>
  <text class="tss" x="950" y="663" text-anchor="end" font-size="12px" fill="#334155">black</text>
  <path class="wgnd" d="M960,650 L1020,650" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= FAN 1 ================= -->
  <rect class="blk" x="720" y="690" width="240" height="140" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text class="tm"  x="730" y="736" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">3</text>
  <text class="tm"  x="730" y="796" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">4</text>
  <text class="tm"  x="950" y="726" text-anchor="end" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">1</text>
  <text class="tm"  x="950" y="766" text-anchor="end" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">2</text>
  <text class="tb"  x="840" y="749" text-anchor="middle" font-size="16px" fill="#0f172a" font-weight="bold">FAN 1 &#8212; outbound</text>
  <text class="ts"  x="840" y="770" text-anchor="middle" font-size="13px" fill="#1e293b">Noctua NF-A4x20 5V PWM</text>
  <text class="tss" x="840" y="814" text-anchor="middle" font-size="12px" fill="#334155">1 GND &#183; 2 +5V &#183; 3 TACH &#183; 4 PWM</text>
  <path class="wgnd" d="M960,720 L1020,720" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="w5v"  d="M960,760 L1011,760 A 9,9 0 0,0 1029,760 L1090,760" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= FAN 2 ================= -->
  <rect class="blk" x="720" y="850" width="240" height="140" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text class="tm"  x="730" y="896" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">3</text>
  <text class="tm"  x="730" y="956" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">4</text>
  <text class="tm"  x="950" y="886" text-anchor="end" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">1</text>
  <text class="tm"  x="950" y="926" text-anchor="end" font-size="14px" fill="#0f172a" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">2</text>
  <text class="tb"  x="840" y="909" text-anchor="middle" font-size="16px" fill="#0f172a" font-weight="bold">FAN 2 &#8212; inbound</text>
  <text class="ts"  x="840" y="930" text-anchor="middle" font-size="13px" fill="#1e293b">optional &#8212; dual-fan mode</text>
  <text class="tss" x="840" y="982" text-anchor="middle" font-size="12px" fill="#334155">1 GND &#183; 2 +5V &#183; 3 TACH &#183; 4 PWM</text>
  <path class="wgnd" d="M960,880 L1020,880" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="w5v"  d="M960,920 L1011,920 A 9,9 0 0,0 1029,920 L1090,920" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= RIGHT-HAND POWER COLUMNS ================= -->
  <path class="rail5" d="M370,1000 L1011,1000 A 9,9 0 0,0 1029,1000 L1090,1000" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
  <text class="lbl5" x="450" y="990" font-size="14px" fill="#b91c1c" font-weight="bold">+5 V &#8212; from the dev board 5V pins</text>
  <path class="w5v"  d="M1090,760 L1090,1000" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="wgnd" d="M1020,650 L1020,1120" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1090" cy="760" r="5.5" fill="#dc2626"/>
  <circle cx="1090" cy="920" r="5.5" fill="#dc2626"/>
  <circle cx="1020" cy="720" r="5.5" fill="#0f172a"/>
  <circle cx="1020" cy="880" r="5.5" fill="#0f172a"/>


  <!-- ================= GND RAIL ================= -->
  <path class="railg" d="M60,1120 L1020,1120" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
  <text class="lblg" x="80" y="1146" font-size="14px" fill="#0f172a" font-weight="bold">GND &#8212; star point at the dev board GND pins</text>

  <!-- ================= LEGEND ================= -->
  <path class="w12v" d="M60,1192 L100,1192" fill="none" stroke="#7f1d1d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ts" x="108" y="1197" font-size="13px" fill="#1e293b">12 V in</text>
  <path class="w5v"  d="M180,1192 L220,1192" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ts" x="228" y="1197" font-size="13px" fill="#1e293b">+5 V</text>
  <path class="w33v" d="M285,1192 L325,1192" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ts" x="333" y="1197" font-size="13px" fill="#1e293b">+3.3 V</text>
  <path class="wsig" d="M398,1192 L438,1192" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ts" x="446" y="1197" font-size="13px" fill="#1e293b">signal</text>
  <path class="wgnd" d="M505,1192 L545,1192" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ts" x="553" y="1197" font-size="13px" fill="#1e293b">GND</text>
  <path class="wire" d="M610,1192 L660,1192" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="635" cy="1192" r="5.5" fill="#334155"/>
  <text class="ts" x="672" y="1197" font-size="13px" fill="#1e293b">dot = connected</text>
  <path class="wire" d="M800,1208 L800,1201 A 9,9 0 0,1 800,1183 L800,1176" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="wire" d="M776,1192 L824,1192" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="ts" x="836" y="1197" font-size="13px" fill="#1e293b">hop = crossing, not connected</text>
</svg>
