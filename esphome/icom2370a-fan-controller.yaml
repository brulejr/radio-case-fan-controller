esphome:
  name: icom2370a-fan-controller
  friendly_name: IC-2730A Case Fan Controller

  # Stamps a firmware version into the build. Exposed via the logger, mDNS and
  # the API's device_info, so Home Assistant shows which build is on the board.
  # Bump this whenever you flash a meaningful change.
  project:
    name: "brulejr.radio-case-fan-controller"
    version: "0.1.0"

esp32:
  variant: esp32c6
  framework:
    # ESP32-C6 is not supported by the Arduino framework in ESPHome
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Default is 15min: ESPHome reboots when WiFi can't be reached. Cooling stops
  # while the board reboots, and the fans are powered through it — so cooling
  # must not depend on the network being present.
  reboot_timeout: 0s

  # Fallback hotspot if WiFi is unavailable (e.g. field deployment, no AP)
  ap:
    ssid: "Icom-2730A-Fan-Fallback"
    password: !secret fallback_password

captive_portal:

# Local control page at http://<device-ip>/ — sensors, the fan-curve numbers and
# the Dual Fan Mode switch, without needing Home Assistant.
#
# local: true embeds the CSS/JS in flash. By default they're fetched from
# oi.esphome.io, which would leave the page broken in a field deployment with no
# internet — exactly the case this box is built for.
web_server:
  port: 80
  version: 2
  local: true
  auth:
    username: !secret web_server_username
    password: !secret web_server_password

# --- Temperature probe (DS18B20 on 1-Wire) ---
one_wire:
  - platform: gpio
    # J1 header, deliberately on the opposite side of the board from the fan
    # PWM lines (GPIO18/20 on J3) to keep 25kHz switching noise off the bus
    pin: GPIO6
    # NOTE: use a 4.7k pull-up resistor between the DS18B20 data line and 3.3V

sensor:
  - platform: dallas_temp
    # No `address:` on purpose. With a single device on the bus ESPHome selects
    # it automatically and logs the address it found, so the same firmware runs
    # on any build of this module without editing. Pin an address only if a
    # second 1-Wire device is ever added.
    name: "Enclosure Temperature"
    id: case_temp
    update_interval: 5s
    filters:
      - median:
          window_size: 5
          send_every: 5

  # Noctua fans output 2 tach pulses per revolution.
  #
  # use_pcnt: false was added while chasing a flat 0.00 pulses/min, which turned
  # out to be PWM and tach swapped at the fan connectors — the tach line never
  # carried a signal, so the hardware PCNT path was never actually proven
  # faulty. Kept because software edge counting is more than adequate here: the
  # tach tops out near 167 Hz (~5000 RPM x 2 pulses / 60). Drop it if you want
  # to retest the hardware counter.
  - platform: pulse_counter
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
    use_pcnt: false
    # Drop to 10s as a temporary debugging aid should a tach problem arise —
    # see the Problem solving section of the README.
    update_interval: 60s
    name: "Fan 1 (Outbound) RPM"
    id: fan1_rpm
    unit_of_measurement: "RPM"
    filters:
      # pulse_counter reports pulses/min, and the fan gives 2 pulses per
      # revolution, so RPM = pulses/min / 2.
      - multiply: 0.5

  - platform: pulse_counter
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
    use_pcnt: false
    # Drop to 10s as a temporary debugging aid should a tach problem arise —
    # see the Problem solving section of the README.
    update_interval: 60s
    name: "Fan 2 (Inbound) RPM"
    id: fan2_rpm
    unit_of_measurement: "RPM"
    filters:
      - multiply: 0.5 # pulses/min / 2 pulses-per-rev

# --- PWM control lines to fans (hardware LEDC @ 25kHz, per Noctua spec) ---
output:
  - platform: ledc
    pin: GPIO18
    id: fan1_pwm_out
    frequency: 25000 Hz

  - platform: ledc
    pin: GPIO20
    id: fan2_pwm_out
    frequency: 25000 Hz

# --- Mode toggle: dual-fan (in+out) vs single-fan (outbound only, passive intake) ---
switch:
  - platform: template
    name: "Dual Fan Mode"
    id: dual_fan_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# --- Fan curve parameters, exposed so they're tunable without reflashing ---
number:
  - platform: template
    name: "Fan Curve Min Temp (C)"
    id: min_temp_c
    mode: box
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 25
    optimistic: true
    restore_value: true

  - platform: template
    name: "Fan Curve Max Temp (C)"
    id: max_temp_c
    mode: box
    min_value: 0
    max_value: 80
    step: 1
    initial_value: 45
    optimistic: true
    restore_value: true

  - platform: template
    name: "Fan Minimum Duty"
    id: min_duty
    mode: box
    min_value: 0
    max_value: 1
    step: 0.05
    initial_value: 0.3 # Noctua fans generally need ~30% duty to reliably start
    optimistic: true
    restore_value: true

# --- Control loop: map temperature to PWM duty on a linear ramp ---
interval:
  - interval: 5s
    then:
      - lambda: |-
          float t = id(case_temp).state;
          float lo = id(min_temp_c).state;
          float hi = id(max_temp_c).state;
          float floor_duty = id(min_duty).state;

          // Guard every input, not just the temperature. A NaN setpoint would
          // fall through both comparisons below and produce a NaN duty.
          if (std::isnan(t) || std::isnan(lo) || std::isnan(hi) ||
              std::isnan(floor_duty)) {
            ESP_LOGW("fan", "skipped: t=%.2f lo=%.1f hi=%.1f floor=%.2f",
                     t, lo, hi, floor_duty);
            return;
          }

          float duty = 0.0;

          if (t <= lo) {
            duty = 0.0;
          } else if (t >= hi) {
            duty = 1.0;
          } else {
            float ratio = (t - lo) / (hi - lo);
            duty = floor_duty + ratio * (1.0 - floor_duty);
          }

          ESP_LOGD("fan", "t=%.2f lo=%.1f hi=%.1f floor=%.2f -> duty=%.3f dual=%d",
                   t, lo, hi, floor_duty, duty, id(dual_fan_mode).state ? 1 : 0);

          id(fan1_pwm_out).set_level(duty);

          if (id(dual_fan_mode).state) {
            id(fan2_pwm_out).set_level(duty);
          } else {
            id(fan2_pwm_out).set_level(0.0);
          }
